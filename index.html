<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrol Calculator Pro</title>
     <link rel="icon" type="image/png" href="download.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .container {
            background: #fff;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* TABS (To switch modes) */
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #777;
            width: 50%;
        }

        .tab-btn.active {
            color: #ffa500;
            border-bottom: 3px solid #ffa500;
        }

        /* FORM ELEMENTS */
        .input-group {
            display: none; /* Hidden by default */
        }

        .input-group.active {
            display: block; /* Show active group */
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #555;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box; /* Fixes padding issues */
            font-size: 16px;
        }

        button.calc-btn {
            width: 100%;
            padding: 12px;
            background: #ffa500;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            color: white;
            transition: background 0.3s;
        }

        button.calc-btn:hover {
            background: #e69500;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-left: 5px solid #ffa500;
            border-radius: 4px;
            display: none;
            text-align: center;
        }
        
        .result-main {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        .result-sub {
            font-size: 14px;
            color: #666;
        }

    </style>
</head>

<body>

    <div class="container">
        <h2>⛽ Petrol Calculator</h2>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('cost')">Find Cost</button>
            <button class="tab-btn" onclick="switchTab('range')">Find Range</button>
        </div>

        <div id="cost-form" class="input-group active">
            <label>Trip Distance (km)</label>
            <input type="number" id="distance" placeholder="e.g. 50">
            
            <label>Vehicle Mileage (km/L)</label>
            <input type="number" id="mileage1" placeholder="e.g. 45">

            <label>Fuel Price (₹/L)</label>
            <input type="number" id="price1" placeholder="e.g. 102">

            <button class="calc-btn" onclick="calculateCost()">Calculate Expense</button>
        </div>

        <div id="range-form" class="input-group">
            <label>Amount Filled (₹)</label>
            <input type="number" id="amountFilled" placeholder="e.g. 500">
            
            <label>Fuel Price (₹/L)</label>
            <input type="number" id="price2" placeholder="e.g. 102">

            <label>Vehicle Mileage (km/L)</label>
            <input type="number" id="mileage2" placeholder="e.g. 45">

            <button class="calc-btn" onclick="calculateRange()">Check Distance</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        // Tab Switcher Logic
        function switchTab(mode) {
            // Hide result when switching
            document.getElementById("result").style.display = "none";

            // Toggle Input Forms
            if (mode === 'cost') {
                document.getElementById('cost-form').classList.add('active');
                document.getElementById('range-form').classList.remove('active');
                
                // Update Tab Styles
                document.getElementsByClassName('tab-btn')[0].classList.add('active');
                document.getElementsByClassName('tab-btn')[1].classList.remove('active');
            } else {
                document.getElementById('cost-form').classList.remove('active');
                document.getElementById('range-form').classList.add('active');

                // Update Tab Styles
                document.getElementsByClassName('tab-btn')[0].classList.remove('active');
                document.getElementsByClassName('tab-btn')[1].classList.add('active');
            }
        }

        // Logic 1: Calculate Cost
        function calculateCost() {
            const dist = parseFloat(document.getElementById("distance").value);
            const mileage = parseFloat(document.getElementById("mileage1").value);
            const price = parseFloat(document.getElementById("price1").value);

            if (!dist || !mileage || !price) {
                alert("Please fill all fields");
                return;
            }

            const totalCost = (dist / mileage) * price;
            const liters = dist / mileage;

            showResult(`₹${totalCost.toFixed(0)}`, `Fuel needed: ${liters.toFixed(2)} Liters`);
        }

        // Logic 2: Calculate Range (New Feature)
        function calculateRange() {
            const amount = parseFloat(document.getElementById("amountFilled").value);
            const price = parseFloat(document.getElementById("price2").value);
            const mileage = parseFloat(document.getElementById("mileage2").value);

            if (!amount || !price || !mileage) {
                alert("Please fill all fields");
                return;
            }

            // Step 1: Find how many liters you got
            const liters = amount / price;
            
            // Step 2: Find how far you can go
            const distance = liters * mileage;

            showResult(`${distance.toFixed(1)} km`, `Fuel obtained: ${liters.toFixed(2)} Liters`);
        }

        // Helper to display result
        function showResult(mainText, subText) {
            const resDiv = document.getElementById("result");
            resDiv.style.display = "block";
            resDiv.innerHTML = `
                <span class="result-main">${mainText}</span>
                <span class="result-sub">${subText}</span>
            `;
        }
    </script>

</body>
</html>
